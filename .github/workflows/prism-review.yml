name: PRism Review (Reusable)

on:
  workflow_call:
    inputs:
      owner:
        description: GitHub repo owner
        required: true
        type: string
      repo:
        description: GitHub repo name
        required: true
        type: string
      pull_number:
        description: Pull request number
        required: true
        type: string
      approve_threshold:
        description: Score threshold for auto-approval (0 to disable)
        required: false
        type: number
        default: 0
      enable_jira:
        description: Enable Jira ticket lookup and business alignment scoring
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      JIRA_EMAIL:
        required: false
      JIRA_TOKEN:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PRism
        uses: actions/checkout@v4.2.2
        with:
          repository: redbellynetwork/prism-bot

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: pr-review
        run: npm install

      - name: Run PR review
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: pr-review
        run: |
          npm run review -- \
            "${{ inputs.owner }}" \
            "${{ inputs.repo }}" \
            "${{ inputs.pull_number }}" \
            --comment \
            "--approve=${{ inputs.approve_threshold }}" \
            ${{ inputs.enable_jira && '--jira' || '' }}

      - name: Delete old PRism comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: pr-review
        run: |
          npm run cleanup -- \
            ${{ inputs.owner }} \
            ${{ inputs.repo }} \
            ${{ inputs.pull_number }} \
            --keep=2
